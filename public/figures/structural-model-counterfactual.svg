<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">A structural model transports evidence to a new policy regime</title>
  <desc id="desc">The upper panel passes identified responses and accounting through mechanisms and equilibrium closure to a policy counterfactual. The lower panel shows two models fitting the observed region but diverging after a policy change.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d8d3c8;stroke-width:1.5}.ink{fill:#252a31}.muted{fill:#666f7a}.bluefill{fill:#e9f2fb;stroke:#88add0;stroke-width:1.5}.greenfill{fill:#e9f5ef;stroke:#76ad91;stroke-width:1.5}.orangefill{fill:#fff2e8;stroke:#e3a175;stroke-width:1.5}.purplefill{fill:#eee9f8;stroke:#9980c1;stroke-width:1.5}.arrow{stroke:#252a31;stroke-width:2;fill:none;marker-end:url(#arrow)}.axis{stroke:#6f7782;stroke-width:1.5}.grid{stroke:#e8e4dc;stroke-width:1}.blue{stroke:#2667a8;fill:none;stroke-width:4}.orange{stroke:#d06b32;fill:none;stroke-width:4}.dash{stroke-dasharray:7 6}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.heading{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#252a31"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="heading ink" x="60" y="52">A structural model is a transport device</text>
  <text class="sub muted" x="60" y="80">It carries evidence from the observed regime into a policy regime that may change the environment</text>

  <rect class="panel" x="55" y="112" width="1090" height="250" rx="8"/>
  <text class="label ink" x="85" y="150">A. What the model adds</text>
  <rect class="bluefill" x="85" y="192" width="210" height="88" rx="8"/>
  <text class="label ink" x="190" y="222" text-anchor="middle">Empirical anchors</text>
  <text class="body ink" x="190" y="248" text-anchor="middle">causal responses • accounts</text>
  <text class="body ink" x="190" y="270" text-anchor="middle">covariances • dynamics</text>
  <line class="arrow" x1="295" y1="236" x2="365" y2="236"/>
  <rect class="greenfill" x="370" y="174" width="285" height="124" rx="8"/>
  <text class="label ink" x="512" y="205" text-anchor="middle">Mechanisms + equilibrium closure</text>
  <text class="body ink" x="512" y="233" text-anchor="middle">prices • expectations • capital • adoption</text>
  <text class="body ink" x="512" y="257" text-anchor="middle">tax bases • borrowing • constraints</text>
  <text class="small muted" x="512" y="282" text-anchor="middle">assumptions are part of the answer</text>
  <line class="arrow" x1="655" y1="236" x2="725" y2="236"/>
  <rect class="orangefill" x="730" y="192" width="180" height="88" rx="8"/>
  <text class="label ink" x="820" y="222" text-anchor="middle">New policy</text>
  <text class="body ink" x="820" y="248" text-anchor="middle">tax • portfolio</text>
  <text class="body ink" x="820" y="270" text-anchor="middle">financing regime</text>
  <line class="arrow" x1="910" y1="236" x2="980" y2="236"/>
  <rect class="purplefill" x="985" y="192" width="130" height="88" rx="8"/>
  <text class="label ink" x="1050" y="222" text-anchor="middle">Outcomes</text>
  <text class="body ink" x="1050" y="248" text-anchor="middle">incidence</text>
  <text class="body ink" x="1050" y="270" text-anchor="middle">risk • welfare</text>
  <path class="arrow" d="M820 280 C820 330 512 330 512 301"/>

  <rect class="panel" x="55" y="390" width="1090" height="242" rx="8"/>
  <text class="label ink" x="85" y="428">B. Good fit in the observed regime does not identify the extrapolation</text>
  <line class="axis" x1="125" y1="575" x2="1080" y2="575"/>
  <line class="axis" x1="125" y1="465" x2="125" y2="575"/>
  <line class="grid" x1="125" y1="520" x2="1080" y2="520"/>
  <line class="axis dash" x1="650" y1="452" x2="650" y2="585"/>
  <text class="small muted" x="385" y="608" text-anchor="middle">observed policy range</text>
  <text class="small muted" x="865" y="608" text-anchor="middle">new policy regime</text>
  <text class="small muted" transform="translate(92 552) rotate(-90)">predicted outcome</text>
  <path class="blue" d="M145 550 C280 530 430 510 650 500 C795 470 915 438 1060 420"/>
  <path class="orange" d="M145 552 C280 532 430 511 650 502 C790 520 925 548 1060 565"/>
  <text class="body ink" x="950" y="418">Model A</text>
  <text class="body ink" x="950" y="562">Model B</text>
  <text class="small muted" x="670" y="478">policy change</text>
  <text class="small muted" x="180" y="488">both match the fitted region</text>
</svg>
